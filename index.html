<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><meta name="description" content="Discover anime on Anime Street India."><title>Anime Street India</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span> ANIME <b>STREET INDIA</b></a><button class="btn btn-quiet" id="searchToggle">⌕ Search</button></header>
<main>
<section class="hero" id="hero"><div class="hero-copy"><span class="eyebrow">WELCOME TO ANIME STREET INDIA</span><h1 id="heroTitle">Discover your next anime</h1><p id="heroDescription">Explore anime details and available episodes.</p><a class="btn btn-primary" id="heroLink" href="#catalog">Explore anime</a></div></section>
<section class="search-panel" id="searchPanel" hidden><input id="searchInput" type="search" placeholder="Search anime by name…"><button class="btn btn-quiet" id="clearSearch">Clear</button></section>
<section class="section-head" id="catalog"><div><span class="eyebrow">YOUR NEXT WATCH</span><h2>Anime library</h2><p class="muted" id="resultCount">Loading titles…</p></div><select id="genreFilter"><option value="">All genres</option></select></section>
<div class="chip-row" id="genreChips"></div><section class="anime-grid" id="animeGrid"><div class="empty-state">Loading anime library…</div></section>
</main><footer class="footer"><span>Anime Street India</span><span>Share only videos you own or are authorized to distribute.</span></footer>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDCS8ijIYoQ3Ho4nduNOs9XmYQtjeT9Jc0",authDomain:"animeshreet.firebaseapp.com",projectId:"animeshreet"});const db=firebase.firestore();let titles=[],activeGenre="";const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function genreText(v){return Array.isArray(v)?v.join(", "):String(v||"Anime")}
function genreList(v){return (Array.isArray(v)?v:String(v||"").split(/[,|]/)).map(x=>String(x).trim()).filter(Boolean)}
function imgUrl(v){try{let u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:""}catch{return ""}}
function card(a){let im=imgUrl(a.poster);return '<a class="anime-card" href="anime.html?name='+encodeURIComponent(a.name||"")+'"><div class="poster-wrap">'+(im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(a.name)+' poster">':'<div class="empty-state">ASI</div>')+'<span class="rating">★ '+esc(a.rating||"—")+'</span></div><div class="card-copy"><h3>'+esc(a.name||"Untitled")+'</h3><p>'+esc(genreText(a.genre))+' · '+esc(a.year||"")+'</p></div></a>'}
function render(){let q=$("searchInput").value.trim().toLowerCase();let data=titles.filter(a=>(!activeGenre||genreList(a.genre).some(g=>g.toLowerCase()===activeGenre.toLowerCase()))&&(!q||String(a.name||"").toLowerCase().includes(q)));$("animeGrid").innerHTML=data.length?data.map(card).join(""):'<div class="empty-state">No anime found. Try another search or genre.</div>';$("resultCount").textContent=data.length+" titles available"}
function genres(){let gs=[...new Set(titles.flatMap(a=>genreList(a.genre)))].sort((a,b)=>a.localeCompare(b));$("genreFilter").innerHTML='<option value="">All genres</option>'+gs.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join("");$("genreChips").innerHTML='<button class="chip active" data-g="">All</button>'+gs.map(g=>'<button class="chip" data-g="'+esc(g)+'">'+esc(g)+'</button>').join("");$("genreChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{activeGenre=b.dataset.g;$("genreFilter").value=activeGenre;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()})}
$("genreFilter").onchange=e=>{activeGenre=e.target.value;render()};$("searchToggle").onclick=()=>{$("searchPanel").hidden=!$("searchPanel").hidden;if(!$("searchPanel").hidden)$("searchInput").focus()};$("searchInput").oninput=render;$("clearSearch").onclick=()=>{$("searchInput").value="";activeGenre="";$("genreFilter").value="";document.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",i===0));render()};
db.collection("anime").onSnapshot(s=>{
 titles=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ta=a.timestamp&&a.timestamp.toMillis?a.timestamp.toMillis():0,tb=b.timestamp&&b.timestamp.toMillis?b.timestamp.toMillis():0;return tb-ta});
 genres();render();
 const a=titles[0];if(a){const im=imgUrl(a.poster);if(im)$("hero").style.backgroundImage='linear-gradient(90deg,#08090df2,#08090d77),url("'+im.replace(/"/g,"%22")+'")';$("heroTitle").textContent=a.name||"Discover anime";$("heroDescription").textContent=a.description||"Explore anime details and available episodes.";$("heroLink").href="anime.html?name="+encodeURIComponent(a.name||"")}
},e=>{$("animeGrid").innerHTML='<div class="empty-state">Could not load anime library. Please try again later.</div>';console.error(e)});
</script></body></html>
