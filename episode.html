<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Opening anime | Anime Street India</title>
</head>
<body>
<p>Opening anime details…</p>
<script>
const params = new URLSearchParams(location.search);
const name = (params.get("name") || "").trim();
if (name) {
  location.replace("anime.html?name=" + encodeURIComponent(name));
} else {
  location.replace("index.html");
}
</script>
<noscript><a href="index.html">Return to Anime Street India</a></noscript>
</body>
</html>
